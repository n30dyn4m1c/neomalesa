name: Update Writing Feed

on:
  workflow_dispatch:
  schedule:
    # Weekly: Mondays 06:00 UTC (16:00 Port Moresby). Run by hand from the Actions tab any time.
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/scripts/update_writing.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest posts from Medium
        run: python3 .github/scripts/update_writing.py

      - name: Commit writing files if changed
        run: |
          if git diff --quiet writing.json writing-data.js; then
            echo "writing files unchanged — nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add writing.json writing-data.js
            git commit -m "Update writing feed"
            git push
          fi
