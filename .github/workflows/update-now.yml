name: Update Now Page

on:
  workflow_dispatch:
  schedule:
    # Weekly: Mondays 06:30 UTC (16:30 Port Moresby), after the writing feed.
    # Run by hand from the Actions tab any time.
    - cron: "30 6 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/scripts/update_now.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Exploring items from the GitHub profile README
        run: python3 .github/scripts/update_now.py

      - name: Commit now.html if changed
        run: |
          if git diff --quiet now.html; then
            echo "now.html unchanged — nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add now.html
            git commit -m "Update Now page from profile README"
            git push
          fi
